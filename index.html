<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac and Yeah</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="header">
        <p class="turn-display"> </p>
        <div class="btn-wrapper">
            <button class="btn-new-name">Change name</button>
            <button class="btn-new-game">New game</button>
        </div>
    </div>

    <div class="player-section player-one">
        <p class="player-name">Player One</p>
        <span>Marker: </span>
        <span class="player-mark">X</span>
    </div>

    <div class="game-announces"></div>

    <div class="board-container">

    </div>

    <div class="player-section player-two">
        <p class="player-name">Player One</p>
        <span>Marker: </span>
        <span class="player-mark">O</span>
    </div>

    <dialog id="new-name-form">
        <form>
            <legend>Set new players names!</legend>
            <div class="player-one-name">
                <label for="in-player-one">Player 1 new name: </label>
                <input id="in-player-one" name="in-player-one" />
            </div>

            <div class="player-two-name">
                <label for="in-player-two">Player 2 new name: </label>
                <input id="in-player-two" name="in-player-two" />
            </div>
            <button class="btn-save-name" type="button">Save</button>
            <button class="btn-cancel-name" type="button" commandfor="new-name-form" command="close">Cancel</button>
        </form>
    </dialog>
</body>

</html>
